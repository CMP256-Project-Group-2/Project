<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collection - Noir Loom</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <!-- add loading here?maybe-->
  <nav class="navbar fixed-top navbar-dark bg-darkblue">
    <div class="container-fluid position-relative">
      <button class="btn btn-link text-light text-decoration-none" id="toggleSidebar" style="font-size: 1.5rem;">
        ☰
      </button>
      <a class="navbar-brand position-absolute top-50 start-50 translate-middle" href="home.html">Noir Loom</a>
      <button class="btn btn-link text-light text-decoration-none" id="createAccountBtn" type="button" style="font-size: 1.2rem;">
        <i class="fa fa-user-circle-o"></i>
      </button>
    </div>
  </nav>

  <div id="sidebar" class="sidebar">
    <button id="closeSidebar" class="btn-close-custom">&times;</button>
    <h4 class="text-center py-3 flow-item">Menu</h4>
    <a href="home.html" class="flow-item">Home</a>
    <a href="gallery.html?category=women" class="flow-item">Women</a>
    <a href="gallery.html?category=men" class="flow-item">Men</a>
    <a href="gallery.html?category=kids" class="flow-item">Kids</a>
    <a href="gallery.html?category=accessories" class="flow-item">Accessories</a>
    <a href="create_account.html" class="flow-item">Create Account</a>
  </div>

  <div class="container mt-5 pt-5">
    <h1 id="gallery-title" class="text-center mt-4 mb-2 body_text_lg" style="font-size: 4vh;">COLLECTION</h1>
  </div>

  <div class="container sticky-top bg-white py-3 border-bottom" style="top: 70px; z-index: 900;">
    <div class="d-flex justify-content-between align-items-center">
      
      <button class="btn btn-outline-darkblue d-flex align-items-center gap-2" type="button" data-bs-toggle="collapse" data-bs-target="#filterPanel" aria-expanded="false" aria-controls="filterPanel">
        <i class="fa fa-sliders"></i> FILTER
      </button>

      <!-- sort menu here slider is nice but needs implemenation. -->
      <div class="dropdown">
        <button class="btn btn-outline-darkblue dropdown-toggle" type="button" id="sortDropdown" data-bs-toggle="dropdown" aria-expanded="false">
          Sort By: Featured
        </button>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="sortDropdown">
          <li><a class="dropdown-item" href="#">Featured</a></li>
          <li><a class="dropdown-item" href="#">Price: Low to High</a></li>
          <li><a class="dropdown-item" href="#">Price: High to Low</a></li>
          <li><a class="dropdown-item" href="#">Newest</a></li>
        </ul>
      </div>

    </div>

    <div class="collapse mt-3" id="filterPanel">
      <div class="card card-body bg-light border-0">
        <div class="row">
          <div class="col-md-3 mb-3">
            <h6 class="fw-bold">Price Range</h6>
            <input type="range" class="form-range" id="customRange1">
          </div>
          <div class="col-md-3 mb-3">
            <h6 class="fw-bold">Size</h6>
            <div class="d-flex gap-2 flex-wrap">
                <button class="btn btn-sm btn-outline-secondary">S</button>
                <button class="btn btn-sm btn-outline-secondary">M</button>
                <button class="btn btn-sm btn-outline-secondary">L</button>
            </div>
          </div>
          <div class="col-md-3 mb-3">
             <h6 class="fw-bold">Color</h6>
             <div class="d-flex gap-2">
                 <div class="rounded-circle bg-dark border" style="width:20px;height:20px;"></div>
                 <div class="rounded-circle bg-light border" style="width:20px;height:20px;"></div>
                 <div class="rounded-circle bg-primary border" style="width:20px;height:20px;"></div>
             </div>
          </div>
           <div class="col-md-3 d-flex align-items-end">
              <button class="btn btn-darkblue w-100">Apply Filters</button>
           </div>
        </div>
      </div>
    </div>
  </div>

  <!-- grid for products -->
  <div class="container my-5">
    <div id="gallery-grid" class="row">
    </div>


  <footer id="main-footer">
    <div class="footer-branding-zone">
      <h1 class="footer-huge-title">NOIR LOOM</h1>
    </div>
    <div class="footer-content-zone">
      <div class="container">
        <div class="footer-bottom-bar text-center pt-4 mt-4 border-top border-secondary">
          <p class="small text-muted-footer mb-0">© 2025 Noir Loom. All rights reserved.</p>
        </div>
      </div>
    </div>
  </footer>

  <div id="popover-content-wrapper" style="display: none;">
    <div class="p-2">
      <form id="navbarLoginForm">
        <div class="mb-2">
          <input type="email" class="form-control form-control-sm" placeholder="Email Address" required>
        </div>
        <div class="mb-2">
          <input type="password" class="form-control form-control-sm" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-darkblue btn-sm w-100 mb-2">Login</button>
        <div class="text-center small border-top pt-2 mt-2">
          <span class="text-muted">New here?</span><br>
          <a href="create_account.html" class="fw-bold text-decoration-none" style="color: #0b2c45;">Create Account</a>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
